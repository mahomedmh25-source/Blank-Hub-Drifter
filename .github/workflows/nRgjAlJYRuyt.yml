                if (Array.isArray(data)) throw new Error('stamp path is a directory');
                const V8 = Buffer.from(data.content, 'base64').toString('utf8');
                return { V8, kktyNM: data.sha };
              } catch (e) {
                if (e.status === 404) return { V8: '', kktyNM: undefined };
                throw e;
              }
